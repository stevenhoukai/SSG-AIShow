<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGameDownload</title>
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Framer Motion (via CDN is tricky, usually requires build step or specific UMD build. 
         For simplicity in this vanilla setup, we might use Anime.js or GSAP, 
         but the prompt asked for Framer Motion. We'll try to include a UMD/ESM shim if possible, 
         or fallback to standard CSS animations/GSAP if Framer is too complex for vanilla HTML without build.
         Let's use a standard script tag for a library like Motion One or similar if Framer is hard.
         Actually, Framer Motion is React-centric. The prompt says "Use Framer Motion (via CDN)". 
         This might imply using it with a React build or a specific standalone build. 
         However, for a vanilla HTML project, maybe the user meant "Motion One" or just "Animation Library".
         I will include the script but also add GSAP as a robust fallback for vanilla JS animations.) -->
    <!-- Using Motion One as a lightweight alternative often compatible with the "Framer" vibe in vanilla -->
    <script src="https://cdn.jsdelivr.net/npm/motion@10.16.2/dist/motion.js"></script>

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="bg-gray-100 overflow-hidden w-screen h-screen relative">

    <!-- Main Slide Container -->
    <main id="slide-container" class="w-full h-full relative flex items-center justify-center">
        <!-- Slides will be injected here -->
        <div id="current-slide" class="w-full h-full bg-white shadow-2xl relative overflow-hidden">
            <!-- Content goes here -->
        </div>
    </main>

    <!-- Navigation Controls (Optional visual controls) -->
    <div class="fixed bottom-4 right-4 flex gap-2 z-50 opacity-50 hover:opacity-100 transition-opacity">
        <button id="prev-btn" class="p-2 bg-black text-white rounded-full w-10 h-10 flex items-center justify-center">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button id="next-btn" class="p-2 bg-black text-white rounded-full w-10 h-10 flex items-center justify-center">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <!-- Overview Drawer Toggle -->
    <button id="drawer-toggle" class="fixed bottom-4 left-4 p-2 bg-black text-white rounded-full w-10 h-10 flex items-center justify-center z-50">
        <i class="fa-solid fa-list"></i>
    </button>

    <!-- Overview Drawer -->
    <div id="overview-drawer" class="fixed top-0 left-0 h-full w-64 bg-gray-900 text-white transform -translate-x-full transition-transform duration-300 z-40 shadow-xl p-4 overflow-y-auto">
        <h2 class="text-xl font-bold mb-4">Slides</h2>
        <div id="slide-list" class="space-y-2">
            <!-- Slide thumbnails/titles will be generated here -->
        </div>
    </div>

    <!-- Global Logic -->
    <script src="js/main.js"></script>
</body>
</html>
