<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSG分享巅峰榜 - Retro Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --phosphor-green: #33ff33;
            --phosphor-dim: #1a801a;
            --phosphor-bright: #ccffcc;
            --bg-color: #050a05;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --crt-flicker: rgba(51, 255, 51, 0.02);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--phosphor-green);
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 3D Vortex Canvas Background */
        #vortex-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            filter: blur(1px);
        }

        /* CRT Overlay Effects */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            background:
                linear-gradient(var(--scanline-color) 50%, rgba(0, 0, 0, 0) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            5% {
                opacity: 0.95;
            }

            10% {
                opacity: 0.9;
            }

            15% {
                opacity: 0.95;
            }

            20% {
                opacity: 0.99;
            }

            50% {
                opacity: 0.95;
            }

            55% {
                opacity: 0.9;
            }

            60% {
                opacity: 0.99;
            }

            100% {
                opacity: 0.97;
            }
        }

        /* Main Container */
        .container {
            z-index: 1;
            width: 90%;
            max-width: 1000px;
            margin-top: 5vh;
            padding-bottom: 5vh;
            text-align: center;
        }

        /* Title Style */
        h1.retro-title {
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            text-shadow:
                0 0 5px var(--phosphor-dim),
                0 0 10px var(--phosphor-green),
                0 0 20px var(--phosphor-green);
            border-bottom: 4px double var(--phosphor-green);
            padding-bottom: 1rem;
        }

        h1.retro-title::before,
        h1.retro-title::after {
            content: "[ SYSTEM_ROOT ]";
            position: absolute;
            font-size: 1rem;
            top: -1.5rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        h1.retro-title::before {
            left: 0;
        }

        h1.retro-title::after {
            right: 0;
            content: "[ ACCESS_GRANTED ]";
        }

        /* Leaderboard Style */
        .leaderboard-frame {
            border: 2px solid var(--phosphor-green);
            background: rgba(0, 20, 0, 0.85);
            box-shadow:
                0 0 15px rgba(51, 255, 51, 0.2),
                inset 0 0 20px rgba(51, 255, 51, 0.1);
            padding: 2px;
            position: relative;
        }

        /* Frame decoration corners */
        .leaderboard-frame::before {
            content: "";
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid transparent;
            border-top-color: var(--phosphor-green);
            border-bottom-color: var(--phosphor-green);
            pointer-events: none;
        }

        .header-row {
            display: grid;
            grid-template-columns: 80px 1fr 150px 120px;
            padding: 1rem 2rem;
            border-bottom: 2px dashed var(--phosphor-dim);
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 5px var(--phosphor-green);
            background: rgba(51, 255, 51, 0.1);
        }

        .list-container {
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .list-container::-webkit-scrollbar {
            width: 10px;
        }

        .list-container::-webkit-scrollbar-track {
            background: #001100;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: var(--phosphor-dim);
            border: 1px solid var(--phosphor-green);
        }

        .rank-item {
            display: grid;
            grid-template-columns: 80px 1fr 150px 120px;
            padding: 1.2rem 2rem;
            align-items: center;
            border-bottom: 1px dotted var(--phosphor-dim);
            transition: background 0.2s, text-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }

        .rank-item:hover {
            background: rgba(51, 255, 51, 0.15);
            text-shadow: 0 0 8px var(--phosphor-green);
        }

        .rank-item:last-child {
            border-bottom: none;
        }

        .rank-num {
            font-size: 2rem;
            font-weight: bold;
        }

        /* Top 3 Special Styles */
        .rank-item:nth-child(1) .rank-num {
            color: #ffff33;
            text-shadow: 0 0 10px #ffff33;
        }

        .rank-item:nth-child(2) .rank-num {
            color: #cccccc;
            text-shadow: 0 0 10px #cccccc;
        }

        .rank-item:nth-child(3) .rank-num {
            color: #cc9966;
            text-shadow: 0 0 10px #cc9966;
        }

        .user-name {
            font-size: 1.8rem;
            text-align: left;
            padding-left: 2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-role {
            font-size: 1rem;
            color: var(--phosphor-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-score {
            font-size: 1.8rem;
            text-align: right;
            font-family: 'VT323', monospace;
        }

        .user-score::after {
            content: " pts";
            font-size: 1rem;
            opacity: 0.7;
        }

        /* Blinking cursor effect for hover */
        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 1.5rem;
            background: var(--phosphor-green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
            opacity: 0;
        }

        .rank-item:hover .cursor-blink {
            opacity: 1;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1.retro-title {
                font-size: 3rem;
            }

            .header-row,
            .rank-item {
                grid-template-columns: 50px 1fr 100px;
                padding: 1rem;
            }

            .user-role {
                display: none;
            }

            /* Hide role on small screens */
            .user-name {
                font-size: 1.4rem;
                padding-left: 1rem;
            }

            .rank-num {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <!-- Canvas for 3D Particle Vortex -->
    <canvas id="vortex-canvas"></canvas>

    <!-- CRT Screen Overlay -->
    <div class="crt-overlay"></div>

    <div class="container">
        <!-- Title -->
        <h1 class="retro-title" data-value="SSG分享巅峰榜">SSG分享巅峰榜</h1>

        <!-- Leaderboard -->
        <div class="leaderboard-frame">
            <div class="header-row">
                <div class="h-rank">RK</div>
                <div class="h-user" style="text-align: left; padding-left: 2rem;">OPERATOR</div>
                <div class="h-role">CLASS</div>
                <div class="h-score" style="text-align: right;">DATA</div>
            </div>

            <div class="list-container" id="leaderboard-body">
                <!-- JS will generate items here -->
            </div>
        </div>

        <div style="margin-top: 20px; font-size: 0.9rem; opacity: 0.7; letter-spacing: 2px;">
            // TERMINAL_SESSION_ID: 8973-XJ-9 // CONNECTION_SECURE
        </div>
    </div>

    <script>
        /**
         * 1. 3D Particle Vortex Effect (Canvas)
         */
        const canvas = document.getElementById('vortex-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 600;
        const fov = 250; // Field of View
        const baseSpeed = 2;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#050a05';
            ctx.fillRect(0, 0, width, height);
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(randomZ = false) {
                // Polar coordinates (angle, radius) to Cartesian
                // But specifically designed for a tunnel/vortex effect
                this.angle = Math.random() * Math.PI * 2;
                this.radius = 100 + Math.random() * 800; // Distance from center tube

                // Z position
                if (randomZ) {
                    this.z = Math.random() * 2000;
                } else {
                    this.z = 2000; // Start far away
                }

                this.speed = baseSpeed + Math.random() * 3;
                this.color = Math.random() > 0.9 ? '#ffffff' : (Math.random() > 0.5 ? '#33ff33' : '#1a801a');
                this.sizeBase = Math.random() * 2 + 0.5;
            }

            update() {
                this.z -= this.speed;

                // Vortex rotation effect - rotate angle based on speed
                this.angle += 0.005 * this.speed;

                if (this.z <= 1) { // Passed the screen
                    this.reset();
                }
            }

            draw() {
                // Perspective projection
                const scale = fov / (fov + this.z);

                // 3D Rotation transform (Vortex twist)
                // Calculate current X, Y relative to center based on helical path 
                // As Z gets smaller (closer), we can spiral

                // Simple Tunnel formula:
                const x3d = Math.cos(this.angle) * this.radius * 2; // Spread out more
                const y3d = Math.sin(this.angle) * this.radius * 2;

                const x2d = x3d * scale + width / 2;
                const y2d = y3d * scale + height / 2;

                const size = this.sizeBase * scale * 3;

                const alpha = Math.min(1, (2000 - this.z) / 1000); // Fade in from distance

                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;

                // Draw rectangles for retro feel instead of circles
                ctx.fillRect(x2d, y2d, size, size);

                // Optional: Draw connecting lines for wireframe feel if close enough
                if (Math.random() > 0.995) {
                    ctx.strokeStyle = '#1a801a';
                    ctx.beginPath();
                    ctx.moveTo(width / 2, height / 2);
                    ctx.lineTo(x2d, y2d);
                    ctx.stroke();
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Trail effect
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = '#050a05';
            ctx.fillRect(0, 0, width, height);

            particles.sort((a, b) => b.z - a.z); // Draw far particles first

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();


        /**
         * 2. Populate Leaderboard Data
         */
        const leaderboardData = [
            { name: "CyberMonk_史蒂芬猴", role: "NetRunner", score: 9942 },
            { name: "NeonSamurai_代码武士", role: "Solo", score: 8871 },
            { name: "Quantum_Ghost", role: "Hacker", score: 8205 },
            { name: "Binary_Oracle", role: "AI_Construct", score: 7653 },
            { name: "Retro_Viper", role: "Fixer", score: 7102 },
            { name: "Synth_Wave_Lover", role: "Rockerboy", score: 6540 },
            { name: "Pixel_Paladin", role: "Techie", score: 5999 },
            { name: "Data_Drifter", role: "Nomad", score: 5432 },
            { name: "Glitch_Hunter", role: "Media", score: 4800 },
            { name: "Analog_Dreamer", role: "Corp", score: 4210 }
        ];

        const listContainer = document.getElementById('leaderboard-body');

        leaderboardData.forEach((user, index) => {
            const item = document.createElement('div');
            item.className = 'rank-item';

            // Format number to be always 2 digits e.g. 01, 10
            const rankNum = (index + 1).toString().padStart(2, '0');

            item.innerHTML = `
                <div class="rank-num">${rankNum}</div>
                <div class="user-name" data-value="${user.name}">
                    ${user.name}
                    <span class="cursor-blink"></span>
                </div>
                <div class="user-role">${user.role}</div>
                <div class="user-score">${user.score.toLocaleString()}</div>
            `;

            listContainer.appendChild(item);
        });

        /**
         * 3. Hacker Text Effect (Decoding Effect)
         * Mouseover -> Scramble text with random chars -> Reveal original text
         */

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+<>?[]{}|";

        function hackerEffect(event) {
            const target = event.target;
            // Check if we are hovering the user-name div specifically
            if (!target.classList.contains('user-name') && !target.classList.contains('retro-title')) return;

            const originalText = target.dataset.value;
            if (!originalText) return;

            // Prevent multiple intervals running on same element
            if (target.dataset.animating === "true") return;
            target.dataset.animating = "true";

            let iterations = 0;
            const maxIterations = 20; // How long the effect lasts

            const interval = setInterval(() => {
                target.childNodes[0].nodeValue = originalText
                    .split("")
                    .map((letter, index) => {
                        // After some time, start resolving letters from left to right
                        if (index < iterations - 5) { // -5 makes it start resolving a bit later
                            return originalText[index];
                        }
                        // Return random character
                        return letters[Math.floor(Math.random() * letters.length)];
                    })
                    .join("");

                if (iterations >= originalText.length + 15) { // Run a bit longer than length
                    target.childNodes[0].nodeValue = originalText; // Ensure final state is clean
                    clearInterval(interval);
                    target.dataset.animating = "false";
                }

                iterations += 1 / 2; // Speed of resolving
            }, 30);
        }

        // Attach effect to names
        document.querySelectorAll('.user-name').forEach(name => {
            name.addEventListener('mouseover', hackerEffect);
        });

        // Attach effect to Main Title too
        document.querySelector('.retro-title').addEventListener('mouseover', hackerEffect);

    </script>
</body>

</html>
